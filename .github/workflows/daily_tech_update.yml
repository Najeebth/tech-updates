name: Daily Tech Update

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC  (IST is UTC+5:30)
    - cron: "30 2 * * *"
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: write      # needed to commit the generated .md file

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install feedparser requests

      # ── 4. Run the fetch script ───────────────────────────────────────────
      - name: Fetch tech updates
        run: python fetch_updates.py

      # ── 5. Commit & push the generated file ──────────────────────────────
      - name: Commit and push daily update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates/
          git diff --cached --quiet || git commit -m "📰 Tech update: $(date +'%Y-%m-%d')"
          git push
